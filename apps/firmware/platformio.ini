; Claudette firmware — ESP32-S3 desk display for Claude Code.
;
;   pio run -e freenove-s3-4in              build
;   pio run -e freenove-s3-4in -t upload    flash over USB
;   pio device monitor                      serial log (115200)
;
; `stub` builds the same firmware against placeholder cl_ui_* / cl_model_*
; functions (src/dev_stub_ui.c) so the HAL and networking can be brought up
; without the shared UI library. It is not what you ship.

[platformio]
default_envs = freenove-s3-4in

[env]
platform = espressif32@6.13.0
framework = arduino
board = esp32-s3-devkitc-1

; Freenove FNK0104S: ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM).
; Forcing QIO has been reported to hang the ROM bootloader on this board: keep DIO.
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I../../packages/lvgl-ui/include
    -Iinclude

lib_deps =
    lovyan03/LovyanGFX@1.2.30
    lvgl/lvgl@9.6.0
    bblanchon/ArduinoJson@7.4.3

[env:freenove-s3-4in]
lib_deps =
    ${env.lib_deps}
    claudette-ui=symlink://../../packages/lvgl-ui

[env:stub]
build_flags =
    ${env.build_flags}
    -DCLAUDETTE_STUB_UI
